name: Deploy Entropi Adaptiv

# Adaptiv har sit EGET udgivelsestarget. Det er hele pointen med SUB-DEPLOY:
# saa laenge de to produkter delte gh-pages, kunne et uskyldigt push til main
# slette Mitchs app, og "Adaptiv er ikke en udvidelse af Coach" var kun sandt
# i kildekoden, ikke i udgivelsen.
#
# Kilden bliver her i App paa feature/subscription-app-slice-1. Kun det byggede
# resultat sendes til Entropicoaching/adaptiv-app, som har sit eget Pages-site.
# Et GitHub-repo kan kun have EET Pages-site, og App bruger sit paa
# app.entropicoaching.dk — derfor et separat udgivelsesrepo.

on:
  push:
    branches: [feature/subscription-app-slice-1]
  workflow_dispatch:

# Triggeren stod foerst som workflow_dispatch alene, for ikke at udgive til et
# domaene hvis redirect-URL'er endnu ikke var whitelistet i shadow — det ville
# laase Mitch ude, samme fejlklasse som 6. august.
#
# To ting aendrede det. For det foerste kan workflow_dispatch kun udloeses hvis
# filen ligger paa default branch, og den ligger her paa pilot-grenen; en manuel
# koersel var altsaa slet ikke mulig uden foerst at pushe til main.
# For det andet gaelder faren ikke endnu: adaptiv-app er tomt, og
# adaptiv.entropicoaching.dk peger ingen steder. Der er intet at laase nogen ude af.
#
# Naar domaenet ER live, er automatisk udgivelse ved push netop det oenskede —
# men saa skal redirect-URL'erne vaere paa plads FOERST. Se
# control-tower/status/SUB-DEPLOY-OPSAETNING.md, trin 3 foer trin 4.

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Standalone-build af piloten alene. IKKE build:pages — den bygger
      # portalen og Adaptiv sammen, og det er netop koblingen vi fjerner her.
      - name: Byg Adaptiv
        run: npm run build:subscription-public
        env:
          VITE_SUB_SUPABASE_URL: ${{ secrets.VITE_SUB_SUPABASE_URL }}
          VITE_SUB_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUB_SUPABASE_ANON_KEY }}
          VITE_SUB_SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUB_SUPABASE_PROJECT_REF }}

      # Porten. Den kraever at bundlen peger paa shadow, IKKE paa produktion,
      # og at der er en Supabase-noegle i den. Uden det sidste tjek ville et
      # build helt uden secrets blive udgivet som en app ingen kan logge ind i
      # — og ingen ville opdage det, fordi ingen ser et workflow-build.
      - name: Verificér buildet
        run: node scripts/verify-subscription-public-build.mjs

      # Paa eget subdomaene skal roden svare. Vite bygger subscription.html;
      # uden dette skulle brugeren skrive /subscription.html i adressefeltet.
      - name: Gør subscription.html til forside
        run: cp dist-subscription-public/subscription.html dist-subscription-public/index.html

      - name: Skriv CNAME
        run: echo 'adaptiv.entropicoaching.dk' > dist-subscription-public/CNAME

      - name: Udgiv til adaptiv-app
        uses: peaceiris/actions-gh-pages@v4
        with:
          # GITHUB_TOKEN kan kun skrive i DETTE repo, saa push til adaptiv-app
          # kraever en egen legitimation. Valgt: en SSH deploy key frem for en PAT.
          #
          # En PAT hoerer til en PERSON og kan naa alt hvad personen kan — selv en
          # fine-grained PAT skal fornys og kan udvides ved et uheld. En deploy key
          # hoerer til ET repo, kan ikke bruges andre steder, og har ingen udloebsdato
          # der pludselig braekker deployet med en 403 der ligner noget andet.
          # Den offentlige halvdel ligger som read-write deploy key paa adaptiv-app;
          # den private som ACTIONS_DEPLOY_KEY her i App.
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: Entropicoaching/adaptiv-app
          publish_branch: gh-pages
          publish_dir: ./dist-subscription-public
          # Ingen keep_files her. adaptiv-app baerer KUN Adaptiv, saa der er
          # intet fremmed indhold at bevare — og en fuld erstatning er den
          # rigtige adfaerd naar et produkt har sit target for sig selv.
          # Det er praecis den frihed App-repoet ikke har.
          commit_message: "deploy adaptiv fra ${{ github.sha }}"
