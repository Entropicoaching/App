    <script>/* Ordre 1542a: mørk varm skærm er standard; lys huskes (Mig > Skærm, eller ?tema=lys / ?tema=moerk). */try{var t=new URLSearchParams(location.search).get("tema");if(t==="lys"||t==="moerk")localStorage.setItem("entropi:tema",t);if(localStorage.getItem("entropi:tema")==="lys"){document.documentElement.setAttribute("data-tema","lys");document.querySelector('meta[name="theme-color"]').setAttribute("content","#f7f2e9")}}catch(e){}</script>
